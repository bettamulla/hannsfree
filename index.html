<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hannsfree — what your Shopify store is leaking</title>
  <meta name="description" content="Eight questions. Ninety seconds. The revenue your Shopify store is losing through broken email and SMS, in one number." />

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>body { margin: 0; background: #7455FF; }</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* inline icons (lucide paths) */
const IconBase = ({ size = 24, color = "currentColor", children, ...p }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
       strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>{children}</svg>
);
const ArrowRight = (p) => <IconBase {...p}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></IconBase>;
const ArrowLeft = (p) => <IconBase {...p}><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></IconBase>;
const TrendingDown = (p) => <IconBase {...p}><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></IconBase>;
const ChevronDown = (p) => <IconBase {...p}><path d="m6 9 6 6 6-6"/></IconBase>;


/* ————— constants ————— */

const STRIPE_LINK = "https://buy.stripe.com/28E00i21I4gS6FucXVejK05"; // setup
const RETAINER_LINK = "https://buy.stripe.com/5kQ14m35M6p04xmga7ejK06"; // sent post-call
const CALL_LINK = "https://cal.com/hanns-free-pacrhe/30min";
const WALKTHROUGH_LINK = "https://cal.com/hanns-free-pacrhe/30min"; // TODO: swap for a dedicated walkthrough event

const PURPLE = "#7455FF";
const INK = "#0B0B0F";

const money = (n) =>
  n.toLocaleString("en-GB", { style: "currency", currency: "GBP", maximumFractionDigits: 0 });

/* ————— diagnostic questions ————— */

const QUESTIONS = [
  {
    key: "newSubs",
    label: "New subscribers per month",
    placeholder: "500",
    why: "Every subscriber who never gets a proper welcome sequence is a first purchase that never happens. We benchmark a 4% conversion gap here.",
  },
  {
    key: "orders",
    label: "Orders per month",
    placeholder: "300",
    why: "Orders without a post-purchase flow behind them leave repeat revenue on the table — roughly 7% of order value goes unclaimed.",
  },
  {
    key: "aov",
    label: "Average order value (£)",
    placeholder: "55",
    why: "AOV is the multiplier on every leak. Every recovered cart, browse or checkout is worth this much.",
  },
  {
    key: "abandonedCarts",
    label: "Abandoned carts per month",
    placeholder: "400",
    why: "A proper 3-touch abandonment flow recovers around 10% of these. Most stores run one weak email, or none.",
  },
  {
    key: "checkoutStarts",
    label: "Checkouts started, not finished",
    placeholder: "150",
    why: "These people entered payment details territory and left. Highest intent on your site — ~6% recoverable.",
  },
  {
    key: "nonPurchasingVisitors",
    label: "Non-purchasing visitors per month",
    placeholder: "6000",
    why: "Browse-abandonment flows convert around 3% of identified visitors who looked and left.",
  },
  {
    key: "emailRevenue",
    label: "Current monthly email revenue (£)",
    placeholder: "2000",
    why: "Campaign cadence gaps typically leave 17.5% of existing email revenue unrealised.",
  },
  {
    key: "openRate",
    label: "Average open rate (%)",
    placeholder: "22",
    why: "Under 15% signals deliverability decay — inbox providers are burying you. That puts ~15% of email revenue at risk.",
  },
];

const FLOWS = [
  { key: "welcome", name: "Welcome Flow", calc: (v) => v.newSubs * 0.04 * v.aov },
  { key: "cart", name: "Cart Abandonment", calc: (v) => v.abandonedCarts * 0.1 * v.aov },
  { key: "browse", name: "Browse Abandonment", calc: (v) => v.nonPurchasingVisitors * 0.03 * v.aov },
  { key: "checkout", name: "Checkout Abandonment", calc: (v) => v.checkoutStarts * 0.06 * v.aov },
  { key: "postpurchase", name: "Post-Purchase Flow", calc: (v) => v.orders * 0.07 * v.aov },
  { key: "campaigns", name: "Campaign Cadence", calc: (v) => v.emailRevenue * 0.175 },
  { key: "deliverability", name: "Deliverability & Hygiene", calc: (v) => v.emailRevenue * 0.15, flagOnly: true },
];

/* ————— the mark: two mirrored hands cupping a broken circle ————— */

function Mark({ size = 120, stroke = INK }) {
  return (
    <svg width={size} height={size} viewBox="0 0 2000 2000" xmlns="http://www.w3.org/2000/svg">
      <g fill="none" stroke={stroke} strokeWidth="26" strokeLinecap="round" strokeLinejoin="round">
        {/* circle: two side arcs, gaps where the hands rest */}
        <path d="M 640 571 A 560 560 0 0 0 640 1429" />
        <path d="M 1360 571 A 560 560 0 0 1 1360 1429" />
        {/* top hand */}
        <g id="hf-hand">
          <path d="M 585 645 C 598 555, 660 488, 762 466 C 880 441, 992 476, 1082 504 C 1180 534, 1292 540, 1382 562" />
          <path d="M 648 598 C 700 640, 772 660, 842 654" />
          <path d="M 1052 518 C 1100 540, 1132 584, 1128 632 C 1125 662, 1100 670, 1084 650 C 1071 634, 1069 604, 1077 576" />
          <path d="M 1134 532 C 1182 554, 1214 598, 1210 646 C 1207 676, 1182 684, 1166 664 C 1153 648, 1151 618, 1159 590" />
          <path d="M 1216 544 C 1264 566, 1296 610, 1292 658 C 1289 688, 1264 696, 1248 676 C 1235 660, 1233 630, 1241 602" />
          <path d="M 1298 554 C 1348 576, 1382 622, 1378 672 C 1375 704, 1349 712, 1332 691 C 1318 674, 1316 642, 1324 613" />
        </g>
        {/* bottom hand: exact mirror through the centre */}
        <use href="#hf-hand" transform="rotate(180 1000 1000)" />
      </g>
      <text x="1000" y="1105" textAnchor="middle" fontFamily="'Instrument Serif', Georgia, serif"
            fontWeight="700" fontSize="400" fill={stroke} letterSpacing="-16">HF</text>
    </svg>
  );
}

/* ————— count-up hook ————— */

function useCountUp(target, duration = 1400, start = false) {
  const [val, setVal] = useState(0);
  const raf = useRef(null);
  useEffect(() => {
    if (!start) return;
    const t0 = performance.now();
    const tick = (now) => {
      const p = Math.min((now - t0) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 3); // ease-out cubic
      setVal(target * eased);
      if (p < 1) raf.current = requestAnimationFrame(tick);
    };
    raf.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf.current);
  }, [target, start, duration]);
  return val;
}

/* ————— app ————— */

function Hannsfree() {
  // stage: "hero" | 0..7 (question index) | "result"
  const [stage, setStage] = useState("hero");
  const [values, setValues] = useState(
    Object.fromEntries(QUESTIONS.map((q) => [q.key, ""]))
  );
  const [whyOpen, setWhyOpen] = useState(false);
  const [bookOpen, setBookOpen] = useState(false);
  const [entered, setEntered] = useState(true); // per-screen fade
  const inputRef = useRef(null);

  const num = (k) => parseFloat(values[k]) || 0;
  const v = Object.fromEntries(QUESTIONS.map((q) => [q.key, num(q.key)]));

  const flowResults = useMemo(() => {
    return FLOWS.map((f) => {
      const active = f.flagOnly ? v.openRate > 0 && v.openRate < 15 : true;
      return { ...f, value: active ? f.calc(v) : 0, active };
    }).sort((a, b) => b.value - a.value);
  }, [values]);

  const total = flowResults.reduce((s, f) => s + f.value, 0);
  const annual = total * 12;

  const isQuestion = typeof stage === "number";
  const q = isQuestion ? QUESTIONS[stage] : null;

  const go = (next) => {
    setEntered(false);
    setWhyOpen(false);
    setTimeout(() => {
      setStage(next);
      setEntered(true);
    }, 220);
  };

  useEffect(() => {
    if (isQuestion && inputRef.current) inputRef.current.focus();
  }, [stage]);

  const advance = () => {
    if (!isQuestion) return;
    if (stage < QUESTIONS.length - 1) go(stage + 1);
    else go("result");
  };
  const retreat = () => {
    if (isQuestion && stage > 0) go(stage - 1);
    else if (isQuestion) go("hero");
  };

  /* count-up only runs on result screen */
  const shown = useCountUp(total, 1400, stage === "result");

  /* bar widths animate in after result mounts */
  const [barsIn, setBarsIn] = useState(false);
  useEffect(() => {
    if (stage === "result") {
      setBarsIn(false);
      const t = setTimeout(() => setBarsIn(true), 400);
      return () => clearTimeout(t);
    }
  }, [stage]);
  const maxFlow = Math.max(...flowResults.map((f) => f.value), 1);

  /* copy diagnostic to clipboard */
  const [copied, setCopied] = useState(false);
  const copyResults = () => {
    const lines = [
      "HANNSFREE DIAGNOSTIC",
      `Estimated monthly loss: ${money(total)}`,
      `Annual, if nothing changes: ${money(annual)}`,
      "",
      ...flowResults.filter((f) => f.value > 0).map((f) => `${f.name}: ${money(f.value)}`),
      "",
      `Book the walkthrough: ${CALL_LINK}`,
    ].join("\n");
    const done = () => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2500);
    };
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(lines).then(done).catch(done);
    } else {
      const ta = document.createElement("textarea");
      ta.value = lines;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      done();
    }
  };

  const fade = `transition-all duration-200 ease-out ${entered ? "opacity-100 translate-y-0" : "opacity-0 translate-y-2"}`;

  return (
    <div style={{ backgroundColor: PURPLE }} className="min-h-screen overflow-x-hidden flex flex-col" >
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600;800&display=swap');
        .hf-serif { font-family: 'Instrument Serif', Georgia, serif; }
        .hf-mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        @media (prefers-reduced-motion: reduce) {
          * { transition: none !important; animation: none !important; }
        }
      `}</style>

      {/* persistent header — mark hard in the top-left */}
      <header className="pt-3 pl-1 sm:pl-3">
        <button onClick={() => go("hero")} aria-label="Hannsfree home">
          <Mark size={120} />
        </button>
      </header>

      <main className="max-w-xl mx-auto px-5 sm:px-6 pb-16 w-full flex-1">

        {/* ————— HERO ————— */}
        {stage === "hero" && (
          <div className={fade}>
            <h1 className="hf-serif text-4xl sm:text-5xl leading-[1.05] mt-10 mb-6" style={{ color: INK }}>
              Your Shopify store is leaking revenue through broken email &amp; SMS.
            </h1>
            <p className="hf-mono text-sm leading-relaxed mb-10" style={{ color: "rgba(11,11,15,0.72)" }}>
              Eight questions. Ninety seconds. A number at the end that tells you
              exactly what it's costing you every month.
            </p>
            <button
              onClick={() => go(0)}
              className="hf-mono w-full sm:w-auto inline-flex items-center justify-center gap-3 px-8 py-5 rounded-none text-sm font-semibold tracking-wide transition-transform active:scale-[0.98]"
              style={{ backgroundColor: INK, color: PURPLE }}
            >
              RUN THE DIAGNOSTIC <ArrowRight size={16} />
            </button>
            <p className="hf-mono text-[11px] mt-6 mb-10" style={{ color: "rgba(11,11,15,0.5)" }}>
              No email required. The number is yours either way.
            </p>

            <p className="hf-mono text-[11px] tracking-[0.2em] mb-3" style={{ color: "rgba(11,11,15,0.5)" }}>
              ALREADY RAN IT?
            </p>
            <button
              onClick={() => setBookOpen((s) => !s)}
              className="hf-mono w-full sm:w-auto inline-flex items-center justify-center gap-3 px-8 py-5 text-sm font-semibold tracking-wide transition-transform active:scale-[0.98]"
              style={{ backgroundColor: "transparent", color: INK, border: `2px solid ${INK}` }}
            >
              SETUP OR WALKTHROUGH <ChevronDown size={16} className="transition-transform duration-300" style={{ transform: bookOpen ? "rotate(180deg)" : "rotate(0deg)" }} />
            </button>
            <div
              className={`overflow-hidden transition-all duration-300 ease-out ${bookOpen ? "max-h-56 opacity-100 mt-3" : "max-h-0 opacity-0 mt-0"}`}
            >
              <div className="flex flex-col gap-2">
                <a
                  href={STRIPE_LINK} target="_blank" rel="noopener noreferrer"
                  className="hf-mono inline-flex items-center justify-between px-5 py-4 text-xs font-semibold tracking-wide transition-transform active:scale-[0.98]"
                  style={{ backgroundColor: INK, color: PURPLE }}
                >
                  <span>SETUP<span className="block font-normal normal-case tracking-normal mt-0.5" style={{ color: "rgba(116,85,255,0.7)" }}>ready to start — pay setup, we begin</span></span>
                  <ArrowRight size={14} />
                </a>
                <a
                  href={CALL_LINK} target="_blank" rel="noopener noreferrer"
                  className="hf-mono inline-flex items-center justify-between px-5 py-4 text-xs font-semibold tracking-wide transition-transform active:scale-[0.98]"
                  style={{ backgroundColor: INK, color: PURPLE }}
                >
                  <span>WALKTHROUGH<span className="block font-normal normal-case tracking-normal mt-0.5" style={{ color: "rgba(116,85,255,0.7)" }}>bring your diagnostic, we walk every leak</span></span>
                  <ArrowRight size={14} />
                </a>
              </div>
            </div>
          </div>
        )}

        {/* ————— QUESTIONS ————— */}
        {isQuestion && (
          <div className={fade}>
            {/* progress: a thin ink bar filling left to right */}
            <div className="mt-8 mb-10 h-[3px] w-full" style={{ backgroundColor: "rgba(11,11,15,0.18)" }}>
              <div
                className="h-full transition-all duration-500 ease-out"
                style={{ backgroundColor: INK, width: `${((stage + 1) / QUESTIONS.length) * 100}%` }}
              />
            </div>

            <p className="hf-mono text-[11px] tracking-[0.25em] mb-3" style={{ color: "rgba(11,11,15,0.55)" }}>
              {String(stage + 1).padStart(2, "0")} / {String(QUESTIONS.length).padStart(2, "0")}
            </p>

            <label className="hf-serif block text-3xl sm:text-4xl leading-tight mb-8" style={{ color: INK }}>
              {q.label}
            </label>

            <input
              ref={inputRef}
              type="number"
              inputMode="decimal"
              value={values[q.key]}
              onChange={(e) => setValues((s) => ({ ...s, [q.key]: e.target.value }))}
              onKeyDown={(e) => e.key === "Enter" && advance()}
              placeholder={q.placeholder}
              className="hf-mono w-full bg-transparent text-4xl sm:text-5xl font-semibold pb-3 mb-8 focus:outline-none placeholder-black/25"
              style={{ color: INK, borderBottom: `3px solid ${INK}`, caretColor: INK, borderRadius: 0 }}
            />

            {/* why we ask — tap reveal */}
            <button
              onClick={() => setWhyOpen((s) => !s)}
              className="hf-mono text-[11px] tracking-wide underline underline-offset-4 mb-3 block"
              style={{ color: "rgba(11,11,15,0.6)" }}
            >
              {whyOpen ? "hide" : "why we ask this"}
            </button>
            <div
              className={`overflow-hidden transition-all duration-300 ease-out ${whyOpen ? "max-h-40 opacity-100 mb-8" : "max-h-0 opacity-0 mb-6"}`}
            >
              <p className="hf-mono text-xs leading-relaxed pl-3" style={{ color: "rgba(11,11,15,0.7)", borderLeft: `2px solid ${INK}` }}>
                {q.why}
              </p>
            </div>

            <div className="flex items-center gap-3">
              <button
                onClick={retreat}
                aria-label="Back"
                className="inline-flex items-center justify-center w-14 h-14 transition-transform active:scale-[0.95]"
                style={{ border: `2px solid ${INK}`, color: INK }}
              >
                <ArrowLeft size={18} />
              </button>
              <button
                onClick={advance}
                className="hf-mono flex-1 inline-flex items-center justify-center gap-3 h-14 text-sm font-semibold tracking-wide transition-transform active:scale-[0.98]"
                style={{ backgroundColor: INK, color: PURPLE }}
              >
                {stage === QUESTIONS.length - 1 ? "SEE THE NUMBER" : "NEXT"} <ArrowRight size={16} />
              </button>
            </div>
            <p className="hf-mono text-[10px] mt-4" style={{ color: "rgba(11,11,15,0.45)" }}>
              Don't know it? Leave blank and keep moving — the estimate just gets more conservative.
            </p>
          </div>
        )}

        {/* ————— RESULT ————— */}
        {stage === "result" && (
          <div className={fade}>
            <div className="mt-10 mb-2 flex items-center gap-2">
              <TrendingDown size={16} color={INK} />
              <p className="hf-mono text-[11px] uppercase tracking-[0.25em]" style={{ color: "rgba(11,11,15,0.6)" }}>
                estimated monthly loss
              </p>
            </div>

            <p className="hf-serif text-6xl sm:text-7xl leading-none mb-2 tabular-nums" style={{ color: INK }}>
              {money(shown)}
            </p>
            <p className="hf-mono text-xs mb-10" style={{ color: "rgba(11,11,15,0.6)" }}>
              {money(annual)} a year, if nothing changes.
            </p>

            {/* leak bars */}
            <div className="space-y-4 mb-12">
              {flowResults.filter((f) => f.value > 0).map((f, i) => (
                <div key={f.key}>
                  <div className="flex justify-between items-baseline mb-1">
                    <p className="hf-mono text-[11px] tracking-wide" style={{ color: INK }}>{f.name}</p>
                    <p className="hf-mono text-[11px] font-semibold tabular-nums" style={{ color: INK }}>{money(f.value)}</p>
                  </div>
                  <div className="h-[6px] w-full" style={{ backgroundColor: "rgba(11,11,15,0.15)" }}>
                    <div
                      className="h-full transition-all ease-out"
                      style={{
                        backgroundColor: INK,
                        width: barsIn ? `${(f.value / maxFlow) * 100}%` : "0%",
                        transitionDuration: "900ms",
                        transitionDelay: `${i * 90}ms`,
                      }}
                    />
                  </div>
                </div>
              ))}
              {flowResults.every((f) => f.value === 0) && (
                <p className="hf-mono text-xs" style={{ color: "rgba(11,11,15,0.6)" }}>
                  No inputs, no estimate. Go back and give it at least your carts and AOV.
                </p>
              )}
            </div>

            {/* save for the call */}
            {total > 0 && (
              <div className="mb-8 p-4" style={{ border: `2px solid ${INK}` }}>
                <p className="hf-mono text-xs leading-relaxed mb-3" style={{ color: INK }}>
                  Bring this number to the call. We'll walk each leak and confirm
                  which are real on your account.
                </p>
                <button
                  onClick={copyResults}
                  className="hf-mono text-[11px] font-semibold tracking-wide underline underline-offset-4"
                  style={{ color: INK }}
                >
                  {copied ? "copied — paste it anywhere" : "copy my diagnostic"}
                </button>
              </div>
            )}

            {/* CTAs */}
            <div className="flex flex-col gap-3 mb-4">
              <a
                href={CALL_LINK} target="_blank" rel="noopener noreferrer"
                className="hf-mono inline-flex items-center justify-center gap-3 h-14 text-sm font-semibold tracking-wide transition-transform active:scale-[0.98]"
                style={{ backgroundColor: INK, color: PURPLE }}
              >
                BOOK A CALL — WE'LL WALK THE NUMBER <ArrowRight size={16} />
              </a>
              <a
                href={STRIPE_LINK} target="_blank" rel="noopener noreferrer"
                className="hf-mono inline-flex items-center justify-center gap-3 h-14 text-sm font-semibold tracking-wide transition-transform active:scale-[0.98]"
                style={{ backgroundColor: "transparent", color: INK, border: `2px solid ${INK}` }}
              >
                START RECOVERY NOW <ArrowRight size={16} />
              </a>
            </div>

            <button
              onClick={() => go(0)}
              className="hf-mono text-[11px] underline underline-offset-4"
              style={{ color: "rgba(11,11,15,0.55)" }}
            >
              re-run the diagnostic
            </button>

            {/* methodology, folded quietly at the end */}
            <details className="mt-10">
              <summary className="hf-mono text-[11px] cursor-pointer" style={{ color: "rgba(11,11,15,0.55)" }}>
                where these numbers come from
              </summary>
              <div className="mt-3 space-y-2 pl-3" style={{ borderLeft: `2px solid ${INK}` }}>
                {QUESTIONS.map((qq) => (
                  <p key={qq.key} className="hf-mono text-[11px] leading-relaxed" style={{ color: "rgba(11,11,15,0.65)" }}>
                    <span className="font-semibold" style={{ color: INK }}>{qq.label}. </span>{qq.why}
                  </p>
                ))}
              </div>
            </details>
          </div>
        )}
      </main>

      <footer className="max-w-xl mx-auto px-5 sm:px-6 pb-10 text-center">
        <p className="hf-mono text-[11px]" style={{ color: "rgba(11,11,15,0.5)" }}>
          Recoup, containment by <span style={{ fontSize: "0.8em" }}>Hannsfree</span>
        </p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Hannsfree />);

  </script>
</body>
</html>
